# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Check out telegram-bot-api
      run: git clone --depth 1 https://github.com/IJNKAWAKAZE/telegram-bot-api.git "$GITHUB_WORKSPACE/../telegram-bot-api"

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.3'
        cache-dependency-path: "src/go.sum"

    - name: Build
      run: cd src/ && go build -v ./

    - name: Upload executable to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: arknights_bot
        path: src/arknights_bot
        compression-level: 0
